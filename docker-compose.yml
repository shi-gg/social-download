services:
  social-download:
    build:
      context: .
    image: social-download:local
    init: true
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      MAX_DOWNLOAD_MB: "1024"
      MAX_DURATION_MINUTES: "120"
      MAX_CONCURRENT_JOBS: "2"
    volumes:
      - media:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  media:
